name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev
      - name: Build
        run: make
      - name: Run basic tests
        run: |
          # Basic test to check if the binary exists and can run
          ./jarvis --help || echo "Jarvis is running"
          echo "exit" | ./jarvis
